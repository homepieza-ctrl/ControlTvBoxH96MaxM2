              }

              private void doKey(String k) {
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  switch (k) {
                      case "HOME": performGlobalAction(GLOBAL_ACTION_HOME); break;
                      case "BACK": performGlobalAction(GLOBAL_ACTION_BACK); break;
                      case "MENU": performGlobalAction(GLOBAL_ACTION_RECENTS); break;
                      case "INFO": performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS); break;
                      case "POWER": performGlobalAction(GLOBAL_ACTION_POWER_DIALOG); break;
                      case "UP": dpad(GLOBAL_ACTION_DPAD_UP); break;
                      case "DOWN": dpad(GLOBAL_ACTION_DPAD_DOWN); break;
                      case "LEFT": dpad(GLOBAL_ACTION_DPAD_LEFT); break;
                      case "RIGHT": dpad(GLOBAL_ACTION_DPAD_RIGHT); break;
                      case "OK": dpad(GLOBAL_ACTION_DPAD_CENTER); break;
                      case "VOLUME_UP":
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                          break;
                      case "VOLUME_DOWN":
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                          break;
                      case "MUTE":
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, AudioManager.FLAG_SHOW_UI);
                          break;
                      case "PLAY_PAUSE":
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE));
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE));
                          break;
                      case "DEL": editText("", true); break;
                      case "ENTER": enterKey(); break;
                      case "SPACE": editText(" ", false); break;
                      default:
                          if (k.startsWith("NUM_")) editText(k.substring(4), false);
                          break;
                  }
              }

              // ---------- escribir texto ----------
              public void typeText(final String s) {
                  if (s == null) return;
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          try { editText(s, false); } catch (Exception ignored) { }
                      }
                  });
              }

              private void editText(String add, boolean back) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  AccessibilityNodeInfo n = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (n == null) return;
                  CharSequence cur = n.getText();
                  String s = (cur == null || (Build.VERSION.SDK_INT >= 26 && n.isShowingHintText())) ? "" : cur.toString();
                  if (back) {
                      if (s.length() > 0) s = s.substring(0, s.length() - 1);
                  } else {
                      s = s + add;
                  }
                  Bundle b = new Bundle();
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, s);
                  n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b);
              }

              private void enterKey() {
                  boolean done = false;
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root != null && Build.VERSION.SDK_INT >= 30) {
                      AccessibilityNodeInfo n = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                      if (n != null) done = n.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId());
                  }
                  if (!done) dpad(GLOBAL_ACTION_DPAD_CENTER);
              }

              // ---------- toques en pantalla (mouse táctil) ----------
              public void tap(final float fx, final float fy) {
                  ui.post(new Runnable() {
                      @Override
                      public void run() { gesture(fx, fy, fx, fy, 60); }
                  });
              }

              public void swipe(final float x1, final float y1, final float x2, final float y2, final int ms) {
                  ui.post(new Runnable() {
                      @Override
                      public void run() { gesture(x1, y1, x2, y2, ms); }
                  });
              }

              private void gesture(float x1, float y1, float x2, float y2, int ms) {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  gesturePx(x1 * dm.widthPixels, y1 * dm.heightPixels, x2 * dm.widthPixels, y2 * dm.heightPixels, ms);
              }

              private void gesturePx(float x1, float y1, float x2, float y2, int ms) {
                  try {
                      Path p = new Path();
                      p.moveTo(x1, y1);
                      if (x1 != x2 || y1 != y2) p.lineTo(x2, y2);
                      int d = Math.max(50, Math.min(ms, 800));
                      GestureDescription.Builder b = new GestureDescription.Builder();
                      b.addStroke(new GestureDescription.StrokeDescription(p, 0, d));
                      dispatchGesture(b.build(), null, null);
                  } catch (Exception ignored) { }
              }

              // ---------- cursor de mouse en la TV ----------
              private static class CursorView extends View {
                  private final Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint line = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path path = new Path();

                  CursorView(Context c) {
                      super(c);
                      fill.setColor(Color.WHITE);
                      fill.setStyle(Paint.Style.FILL);
                      line.setColor(Color.BLACK);
                      line.setStyle(Paint.Style.STROKE);
                      line.setStrokeWidth(4f);
                      path.moveTo(3, 3);
                      path.lineTo(3, 52);
                      path.lineTo(16, 40);
                      path.lineTo(27, 64);
                      path.lineTo(37, 59);
                      path.lineTo(26, 36);
                      path.lineTo(44, 36);
                      path.close();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      canvas.drawPath(path, fill);
                      canvas.drawPath(path, line);
                  }
              }

              private CursorView cursor;
              private WindowManager.LayoutParams cursorLp;
              private float cx = -1f;
              private float cy = -1f;

              private final Runnable hideCursor = new Runnable() {
                  @Override
                  public void run() {
                      try {
                          if (cursor != null) {
                              ((WindowManager) getSystemService(Context.WINDOW_SERVICE)).removeView(cursor);
                          }
                      } catch (Exception ignored) { }
                      cursor = null;
                  }
              };

              private void ensureCursor() {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  if (cx < 0) { cx = dm.widthPixels / 2f; cy = dm.heightPixels / 2f; }
                  if (cursor == null) {
                      cursor = new CursorView(this);
                      cursorLp = new WindowManager.LayoutParams(
                          50, 70,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                              | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                              | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                              | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                      cursorLp.gravity = Gravity.TOP | Gravity.START;
                      cursorLp.x = (int) cx;
                      cursorLp.y = (int) cy;
                      ((WindowManager) getSystemService(Context.WINDOW_SERVICE)).addView(cursor, cursorLp);
                  }
                  ui.removeCallbacks(hideCursor);
                  ui.postDelayed(hideCursor, 12000);
              }

              public void mmove(final float dx, final float dy) {
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              ensureCursor();
                              DisplayMetrics dm = getResources().getDisplayMetrics();
                              cx = Math.max(0, Math.min(dm.widthPixels - 1, cx + dx));
                              cy = Math.max(0, Math.min(dm.heightPixels - 1, cy + dy));
                              cursorLp.x = (int) cx;
                              cursorLp.y = (int) cy;
                              ((WindowManager) getSystemService(Context.WINDOW_SERVICE)).updateViewLayout(cursor, cursorLp);
                          } catch (Exception ignored) { }
                      }
                  });
              }

              public void mclick() {
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              ensureCursor();
                              gesturePx(cx + 2, cy + 2, cx + 2, cy + 2, 60);
                          } catch (Exception ignored) { }
                      }
                  });
              }

              public void mscroll(final int dir) {
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              ensureCursor();
                              DisplayMetrics dm = getResources().getDisplayMetrics();
                              float span = dm.heightPixels * 0.22f;
                              float y1 = Math.max(10, Math.min(dm.heightPixels - 10, cy + (dir > 0 ? span : -span)));
                              float y2 = Math.max(10, Math.min(dm.heightPixels - 10, cy + (dir > 0 ? -span : span)));
                              gesturePx(cx, y1, cx, y2, 320);
                          } catch (Exception ignored) { }
                      }
                  });
              }

              // ---------- apps ----------
              public String appsJson() {
                  PackageManager pm = getPackageManager();
                  Map<String, String> m = new TreeMap<String, String>();
                  String[] cats = new String[]{Intent.CATEGORY_LAUNCHER, Intent.CATEGORY_LEANBACK_LAUNCHER};
                  for (String cat : cats) {
                      Intent i = new Intent(Intent.ACTION_MAIN);
                      i.addCategory(cat);
                      for (ResolveInfo ri : pm.queryIntentActivities(i, 0)) {
                          String pkg = ri.activityInfo.packageName;
                          if (pkg.equals(getPackageName())) continue;
                          if (!m.containsKey(pkg)) m.put(pkg, String.valueOf(ri.loadLabel(pm)));
                      }
                  }
                  List<Map.Entry<String, String>> l = new ArrayList<Map.Entry<String, String>>(m.entrySet());
                  Collections.sort(l, new java.util.Comparator<Map.Entry<String, String>>() {
                      @Override
                      public int compare(Map.Entry<String, String> x, Map.Entry<String, String> y) {
                          return x.getValue().compareToIgnoreCase(y.getValue());
                      }
                  });
                  StringBuilder sb = new StringBuilder("{\"apps\":[");
                  for (int i = 0; i < l.size(); i++) {
                      if (i > 0) sb.append(",");
                      sb.append("{\"n\":").append(MiniServer.js(l.get(i).getValue()))
                        .append(",\"p\":").append(MiniServer.js(l.get(i).getKey())).append("}");
                  }
                  return sb.append("]}").toString();
              }

              public boolean launch(String pkg) {
                  if (pkg == null) return false;
                  try {
                      Intent i = null;
                      PackageManager pm = getPackageManager();
                      if (pkg.equals("com.android.settings") || pkg.equals("com.android.tv.settings")) {
                          i = new Intent(Settings.ACTION_SETTINGS);
                      } else {
                          i = pm.getLaunchIntentForPackage(pkg);
                          if (i == null) i = pm.getLeanbackLaunchIntentForPackage(pkg);
                      }
                      if (i == null) return false;
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
