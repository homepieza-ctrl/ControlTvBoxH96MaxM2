          @SuppressLint("MissingPermission")
          @CapacitorPlugin(
              name = "BTRemote",
              permissions = { @Permission(alias = "bt", strings = { Manifest.permission.BLUETOOTH_CONNECT }) }
          )
          public class BtPlugin extends Plugin {

              // Descriptor HID: teclado (id 1), control multimedia (id 2) y mouse (id 3)
              private static final int[] D = {
                  0x05,0x01,0x09,0x06,0xA1,0x01,0x85,0x01,
                  0x05,0x07,0x19,0xE0,0x29,0xE7,0x15,0x00,0x25,0x01,0x75,0x01,0x95,0x08,0x81,0x02,
                  0x95,0x01,0x75,0x08,0x81,0x01,
                  0x95,0x06,0x75,0x08,0x15,0x00,0x25,0x65,0x05,0x07,0x19,0x00,0x29,0x65,0x81,0x00,
                  0xC0,
                  0x05,0x0C,0x09,0x01,0xA1,0x01,0x85,0x02,
                  0x15,0x00,0x26,0xFF,0x03,0x19,0x00,0x2A,0xFF,0x03,0x75,0x10,0x95,0x01,0x81,0x00,
                  0xC0,
                  0x05,0x01,0x09,0x02,0xA1,0x01,0x85,0x03,0x09,0x01,0xA1,0x00,
                  0x05,0x09,0x19,0x01,0x29,0x03,0x15,0x00,0x25,0x01,0x95,0x03,0x75,0x01,0x81,0x02,
                  0x95,0x01,0x75,0x05,0x81,0x03,
                  0x05,0x01,0x09,0x30,0x09,0x31,0x09,0x38,0x15,0x81,0x25,0x7F,0x75,0x08,0x95,0x03,0x81,0x06,
                  0xC0,0xC0
              };

              private BluetoothAdapter adapter;
              private BluetoothHidDevice hid;
              private volatile boolean appRegistered = false;
              private volatile BluetoothDevice host = null;
              private volatile BluetoothDevice lastHost = null;
              private volatile int retries = 0;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean keepAliveOn = false;

              private final Runnable keepAlive = new Runnable() {
                  @Override
                  public void run() {
                      if (host != null) send(3, new byte[]{0, 0, 0, 0});
                      handler.postDelayed(this, 6000);
                  }
              };

              private void startKeepAlive() {
                  if (keepAliveOn) return;
                  keepAliveOn = true;
                  handler.postDelayed(keepAlive, 6000);
              }

              private void scheduleReconnect() {
                  if (retries >= 30) return;
                  retries++;
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          BluetoothDevice d = lastHost;
                          if (host == null && hid != null && appRegistered && d != null) {
                              try { hid.connect(d); } catch (Exception ignored) {}
                          }
                      }
                  }, 3000);
              }

              private boolean hasPerm() {
                  return Build.VERSION.SDK_INT < 31
                      || ContextCompat.checkSelfPermission(getContext(), Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED;
              }

              private BluetoothAdapter ad() {
                  if (adapter == null) {
                      BluetoothManager m = (BluetoothManager) getContext().getSystemService(Context.BLUETOOTH_SERVICE);
                      if (m != null) adapter = m.getAdapter();
                  }
                  return adapter;
              }

              @PluginMethod
              public void start(PluginCall call) {
                  if (!hasPerm()) {
                      requestPermissionForAlias("bt", call, "permResult");
                      return;
                  }
                  doStart(call);
              }

              @PermissionCallback
              private void permResult(PluginCall call) {
                  if (hasPerm()) doStart(call);
                  else call.reject("Permiso de Bluetooth denegado");
              }

              private void doStart(PluginCall call) {
                  if (Build.VERSION.SDK_INT < 28) { call.reject("Se necesita Android 9 o superior"); return; }
                  BluetoothAdapter a = ad();
                  if (a == null || !a.isEnabled()) { call.reject("Activa el Bluetooth del teléfono"); return; }
                  if (hid != null) {
                      if (!appRegistered) register();
                      call.resolve();
                      return;
                  }
                  boolean ok = a.getProfileProxy(getContext(), new BluetoothProfile.ServiceListener() {
                      @Override
                      public void onServiceConnected(int profile, BluetoothProfile proxy) {
                          if (profile == BluetoothProfile.HID_DEVICE) {
                              hid = (BluetoothHidDevice) proxy;
                              register();
                          }
                      }

                      @Override
                      public void onServiceDisconnected(int profile) {
                          hid = null;
                          appRegistered = false;
                          host = null;
                      }
                  }, BluetoothProfile.HID_DEVICE);
                  if (!ok) { call.reject("Este teléfono no soporta modo teclado Bluetooth"); return; }
                  call.resolve();
              }

              private void register() {
                  byte[] desc = new byte[D.length];
                  for (int i = 0; i < D.length; i++) desc[i] = (byte) D[i];
                  BluetoothHidDeviceAppSdpSettings sdp = new BluetoothHidDeviceAppSdpSettings(
                      "Control TV Box", "Control remoto", "Control TV Box",
                      BluetoothHidDevice.SUBCLASS1_COMBO, desc);
                  hid.registerApp(sdp, null, null, Executors.newSingleThreadExecutor(), new BluetoothHidDevice.Callback() {
                      @Override
                      public void onAppStatusChanged(BluetoothDevice pluggedDevice, boolean registered) {
                          appRegistered = registered;
                          if (registered) startKeepAlive();
                      }

                      @Override
                      public void onConnectionStateChanged(BluetoothDevice device, int state) {
                          if (state == BluetoothProfile.STATE_CONNECTED) {
                              host = device;
                              lastHost = device;
                              retries = 0;
                          } else if (state == BluetoothProfile.STATE_DISCONNECTED && device != null) {
                              if (device.equals(host)) host = null;
                              if (device.equals(lastHost)) scheduleReconnect();
                          }
                      }
                  });
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject o = new JSObject();
                  BluetoothDevice h = host;
                  String n = "";
                  if (h != null) {
                      try { n = h.getName() == null ? h.getAddress() : h.getName(); } catch (Exception ignored) {}
                  }
                  o.put("ready", hid != null && appRegistered);
                  o.put("connected", h != null);
                  o.put("name", n);
                  call.resolve(o);
              }

              @PluginMethod
              public void discoverable(PluginCall call) {
                  try {
                      Intent i = new Intent(BluetoothAdapter.ACTION_REQUEST_DISCOVERABLE);
                      i.putExtra(BluetoothAdapter.EXTRA_DISCOVERABLE_DURATION, 300);
                      getActivity().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("No se pudo hacer visible el teléfono");
                  }
              }

              @PluginMethod
              public void devices(PluginCall call) {
                  BluetoothAdapter a = ad();
                  if (a == null) { call.reject("Sin Bluetooth"); return; }
                  JSArray arr = new JSArray();
                  Set<BluetoothDevice> bonded = a.getBondedDevices();
                  if (bonded != null) {
                      for (BluetoothDevice d : bonded) {
                          JSObject o = new JSObject();
                          o.put("name", d.getName() == null ? d.getAddress() : d.getName());
                          o.put("address", d.getAddress());
                          arr.put(o);
                      }
                  }
                  JSObject r = new JSObject();
                  r.put("devices", arr);
                  call.resolve(r);
              }

              @PluginMethod
              public void connect(PluginCall call) {
                  String addr = call.getString("address");
                  BluetoothAdapter a = ad();
                  if (hid == null || a == null || addr == null) { call.reject("Primero activa el modo Bluetooth"); return; }
                  try {
                      BluetoothDevice d = a.getRemoteDevice(addr);
                      lastHost = d;
                      retries = 0;
                      hid.connect(d);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("No se pudo conectar");
                  }
              }

              // ---------- envío de teclas ----------
              private boolean send(int id, byte[] data) {
                  BluetoothDevice h = host;
                  if (hid == null || h == null) return false;
                  return hid.sendReport(h, id, data);
              }

              private void nap(int ms) {
                  try { Thread.sleep(ms); } catch (InterruptedException ignored) {}
              }

              private static int consumer(String k) {
                  switch (k) {
                      case "HOME": return 0x0223;
                      case "BACK": return 0x0224;
                      case "VOLUME_UP": return 0x00E9;
                      case "VOLUME_DOWN": return 0x00EA;
                      case "MUTE": return 0x00E2;
                      case "MENU": return 0x0040;
                      case "PLAY_PAUSE": return 0x00CD;
                      case "CHANNEL_UP": return 0x009C;
                      case "CHANNEL_DOWN": return 0x009D;
                      case "POWER": return 0x0030;
                      default: return 0;
                  }
              }

              private static int keyboard(String k) {
                  switch (k) {
                      case "UP": return 0x52;
                      case "DOWN": return 0x51;
                      case "LEFT": return 0x50;
                      case "RIGHT": return 0x4F;
                      case "OK":
                      case "ENTER": return 0x28;
                      case "DEL": return 0x2A;
                      case "SPACE": return 0x2C;
                      default: break;
                  }
                  if (k.startsWith("NUM_")) {
                      try {
                          int n = Integer.parseInt(k.substring(4));
                          return n == 0 ? 0x27 : 0x1E + n - 1;
                      } catch (Exception ignored) {}
                  }
                  return 0;
              }

              private void pressKey(int mod, int code) {
                  send(1, new byte[]{(byte) mod, 0, (byte) code, 0, 0, 0, 0, 0});
                  nap(20);
                  send(1, new byte[8]);
                  nap(15);
              }

              @PluginMethod
              public void key(PluginCall call) {
                  String k = call.getString("key");
                  if (k == null) { call.reject("Falta la tecla"); return; }
                  if (host == null || hid == null) { call.reject("Bluetooth no conectado"); return; }
                  int u = consumer(k);
                  if (u != 0) {
                      send(2, new byte[]{(byte) (u & 0xFF), (byte) ((u >> 8) & 0xFF)});
                      nap(25);
                      send(2, new byte[]{0, 0});
                      call.resolve();
                      return;
                  }
                  int c = keyboard(k);
                  if (c != 0) {
                      pressKey(0, c);
                      call.resolve();
                      return;
                  }
                  call.reject("Tecla no soportada por Bluetooth");
              }

              private int[] map(char c) {
                  if (c >= 'a' && c <= 'z') return new int[]{0, 0x04 + (c - 'a')};
                  if (c >= 'A' && c <= 'Z') return new int[]{2, 0x04 + (c - 'A')};
                  if (c >= '1' && c <= '9') return new int[]{0, 0x1E + (c - '1')};
                  if (c == '0') return new int[]{0, 0x27};
                  switch (c) {
                      case ' ': return new int[]{0, 0x2C};
                      case '.': return new int[]{0, 0x37};
                      case ',': return new int[]{0, 0x36};
                      case '-': return new int[]{0, 0x2D};
                      case '_': return new int[]{2, 0x2D};
                      case '/': return new int[]{0, 0x38};
                      case '@': return new int[]{2, 0x1F};
                      case ':': return new int[]{2, 0x33};
                      case '\'': return new int[]{0, 0x34};
                      case '!': return new int[]{2, 0x1E};
                      case '?': return new int[]{2, 0x38};
                      case '+': return new int[]{2, 0x2E};
                      case '=': return new int[]{0, 0x2E};
                      default: return null;
                  }
              }

              @PluginMethod
              public void text(PluginCall call) {
                  String t = call.getString("text");
                  if (t == null) { call.reject("Falta el texto"); return; }
                  if (host == null || hid == null) { call.reject("Bluetooth no conectado"); return; }
                  t = Normalizer.normalize(t, Normalizer.Form.NFD).replaceAll("\\p{M}", "");
                  for (int i = 0; i < t.length(); i++) {
                      int[] m = map(t.charAt(i));
                      if (m != null) pressKey(m[0], m[1]);
                  }
                  call.resolve();
              }

              private static int clamp(int v) {
                  return Math.max(-127, Math.min(127, v));
              }

              @PluginMethod
              public void mouse(PluginCall call) {
                  int dx = call.getInt("dx", 0);
                  int dy = call.getInt("dy", 0);
                  int w = call.getInt("wheel", 0);
                  int b = call.getInt("btn", 0);
                  send(3, new byte[]{(byte) b, (byte) clamp(dx), (byte) clamp(dy), (byte) clamp(w)});
                  call.resolve();
              }

              @PluginMethod
              public void click(PluginCall call) {
                  int b = call.getInt("btn", 1);
                  send(3, new byte[]{(byte) b, 0, 0, 0});
                  nap(40);
                  send(3, new byte[]{0, 0, 0, 0});
                  call.resolve();
              }
          }
