          cat > MiniServer.java <<'FIN_7'
          package com.control.remoto;

          import android.os.Build;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URLDecoder;
          import java.nio.charset.StandardCharsets;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MiniServer {

              private final RemoteAccessibilityService svc;
              private ServerSocket server;
              private volatile boolean running = false;
              private final ExecutorService pool = Executors.newCachedThreadPool();

              public MiniServer(RemoteAccessibilityService s) {
                  svc = s;
              }

              public void start() {
                  running = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              server = new ServerSocket();
                              server.setReuseAddress(true);
                              server.bind(new InetSocketAddress(8765));
                              while (running) {
                                  final Socket c = server.accept();
                                  pool.execute(new Runnable() {
                                      @Override
                                      public void run() { handle(c); }
                                  });
                              }
                          } catch (Exception ignored) { }
                      }
                  }).start();
              }

              public void stop() {
                  running = false;
                  try { if (server != null) server.close(); } catch (Exception ignored) { }
                  pool.shutdownNow();
              }

              public static String js(String s) {
                  if (s == null) return "\"\"";
                  StringBuilder sb = new StringBuilder("\"");
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if (c == '"' || c == '\\') sb.append('\\').append(c);
                      else if (c < 32) sb.append(' ');
                      else sb.append(c);
                  }
                  return sb.append("\"").toString();
              }

              private Map<String, String> parse(String qs) {
                  Map<String, String> m = new HashMap<String, String>();
                  if (qs == null || qs.isEmpty()) return m;
                  for (String part : qs.split("&")) {
                      int e = part.indexOf('=');
                      try {
                          if (e < 0) m.put(URLDecoder.decode(part, "UTF-8"), "");
                          else m.put(URLDecoder.decode(part.substring(0, e), "UTF-8"), URLDecoder.decode(part.substring(e + 1), "UTF-8"));
                      } catch (Exception ignored) { }
                  }
                  return m;
              }

              private float f(Map<String, String> a, String k) {
                  try { return Float.parseFloat(a.get(k)); } catch (Exception e) { return 0f; }
              }

              private String[] ok() {
                  return new String[]{"200", "{\"ok\":true}"};
              }

              private String[] route(String path, Map<String, String> a) {
                  if (path.equals("/ping")) {
                      return new String[]{"200", "{\"ok\":true,\"name\":" + js(Build.MODEL) + "}"};
                  }
                  if (path.equals("/showcode")) {
                      svc.showCode();
                      return ok();
                  }
                  if (path.equals("/pair")) {
                      String sent = a.get("code");
                      if (sent != null && sent.equals(RemoteAccessibilityService.code)) {
                          String t = svc.addToken();
                          RemoteAccessibilityService.code = RemoteAccessibilityService.newCode();
                          return new String[]{"200", "{\"token\":" + js(t) + "}"};
                      }
                      return new String[]{"403", "{\"error\":\"codigo\"}"};
                  }
                  if (!svc.validToken(a.get("t"))) {
                      return new String[]{"401", "{\"error\":\"token\"}"};
                  }
                  if (path.equals("/key")) { svc.key(a.get("name")); return ok(); }
                  if (path.equals("/text")) { svc.typeText(a.get("s")); return ok(); }
                  if (path.equals("/tap")) { svc.tap(f(a, "x"), f(a, "y")); return ok(); }
                  if (path.equals("/swipe")) {
                      svc.swipe(f(a, "x1"), f(a, "y1"), f(a, "x2"), f(a, "y2"), (int) f(a, "ms"));
                      return ok();
                  }
                  if (path.equals("/mmove")) { svc.mmove(f(a, "dx"), f(a, "dy")); return ok(); }
                  if (path.equals("/mclick")) { svc.mclick(); return ok(); }
                  if (path.equals("/mscroll")) { svc.mscroll((int) f(a, "d")); return ok(); }
                  if (path.equals("/apps")) return new String[]{"200", svc.appsJson()};
                  if (path.equals("/launch")) {
                      return svc.launch(a.get("pkg")) ? ok() : new String[]{"404", "{\"error\":\"app\"}"};
                  }
                  return new String[]{"404", "{\"error\":\"ruta\"}"};
              }

              private void handle(Socket c) {
                  try {
                      c.setSoTimeout(4000);
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8));
                      String line = r.readLine();
                      if (line == null) return;
                      String h;
                      while ((h = r.readLine()) != null && !h.isEmpty()) { }
                      String[] p = line.split(" ");
                      String method = p[0];
                      String target = p.length > 1 ? p[1] : "/";
                      String path = target;
                      String qs = "";
                      int q = target.indexOf('?');
                      if (q >= 0) { path = target.substring(0, q); qs = target.substring(q + 1); }
                      int status;
                      String body;
                      if (method.equals("OPTIONS")) {
                          status = 204;
                          body = "";
                      } else {
                          String[] res = route(path, parse(qs));
                          status = Integer.parseInt(res[0]);
                          body = res[1];
                      }
                      byte[] b = body.getBytes(StandardCharsets.UTF_8);
                      String reason = status == 200 ? "OK" : (status == 204 ? "No Content" : "Error");
                      String head = "HTTP/1.1 " + status + " " + reason + "\r\n"
                          + "Content-Type: application/json; charset=utf-8\r\n"
                          + "Access-Control-Allow-Origin: *\r\n"
                          + "Access-Control-Allow-Headers: *\r\n"
                          + "Access-Control-Allow-Private-Network: true\r\n"
                          + "Connection: close\r\n"
                          + "Content-Length: " + b.length + "\r\n\r\n";
                      OutputStream o = c.getOutputStream();
                      o.write(head.getBytes(StandardCharsets.UTF_8));
                      o.write(b);
                      o.flush();
                  } catch (Exception ignored) {
                  } finally {
                      try { c.close(); } catch (Exception ignored2) { }
                  }
              }
          }
