          @CapacitorPlugin(name = "ADB")
          public class AdbPlugin extends Plugin {

              private Dadb dadb;
              private String current;

              private synchronized Dadb conn(String ip, int port) throws Exception {
                  String id = ip + ":" + port;
                  if (dadb != null && id.equals(current)) return dadb;
                  close();
                  File dir = getContext().getFilesDir();
                  File priv = new File(dir, "adbkey");
                  File pub = new File(dir, "adbkey.pub");
                  if (!priv.exists() || !pub.exists()) AdbKeyPair.generate(priv, pub);
                  AdbKeyPair keys = AdbKeyPair.read(priv, pub);
                  dadb = Dadb.create(ip, port, keys);
                  current = id;
                  return dadb;
              }

              private synchronized void close() {
                  try { if (dadb != null) dadb.close(); } catch (Exception ignored) {}
                  dadb = null;
                  current = null;
              }

              @PluginMethod
              public void shell(PluginCall call) {
                  String ip = call.getString("ip");
                  Integer port = call.getInt("port", 5555);
                  String cmd = call.getString("cmd");
                  if (ip == null || cmd == null) { call.reject("Faltan datos"); return; }
                  try {
                      AdbShellResponse r;
                      try {
                          r = conn(ip, port).shell(cmd);
                      } catch (Exception first) {   // reintenta una vez si la conexión se cayó
                          close();
                          r = conn(ip, port).shell(cmd);
                      }
                      JSObject out = new JSObject();
                      out.put("output", r.getOutput());
                      out.put("exitCode", r.getExitCode());
                      call.resolve(out);
                  } catch (Exception e) {
                      close();
                      call.reject(e.getMessage() == null ? "Error ADB" : e.getMessage());
                  }
              }

              @PluginMethod
              public void listen(PluginCall call) {
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_PROMPT, "Di lo que quieres buscar");
                  try {
                      startActivityForResult(call, i, "listenResult");
                  } catch (Exception e) {
                      call.reject("Sin reconocimiento de voz");
                  }
              }

              @ActivityCallback
              private void listenResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                      ArrayList<String> r = result.getData().getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (r != null && !r.isEmpty()) {
                          JSObject o = new JSObject();
                          o.put("text", r.get(0));
                          call.resolve(o);
                          return;
                      }
                  }
                  call.reject("Cancelado");
              }

              private String localIp() {
                  String cand = null;
                  try {
                      Enumeration<NetworkInterface> en = NetworkInterface.getNetworkInterfaces();
                      while (en != null && en.hasMoreElements()) {
                          NetworkInterface ni = en.nextElement();
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          Enumeration<InetAddress> ad = ni.getInetAddresses();
                          while (ad.hasMoreElements()) {
                              InetAddress a = ad.nextElement();
                              if (a instanceof Inet4Address && a.isSiteLocalAddress()) {
                                  if (ni.getName().startsWith("wlan")) return a.getHostAddress();
                                  if (cand == null) cand = a.getHostAddress();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return cand;
              }

              @PluginMethod
              public void scan(PluginCall call) {
                  final String my = localIp();
                  if (my == null) { call.reject("Sin Wi-Fi"); return; }
                  final int port = call.getInt("port", 5555);
                  final String base = my.substring(0, my.lastIndexOf('.') + 1);
                  ExecutorService ex = Executors.newFixedThreadPool(48);
                  List<Future<String>> fs = new ArrayList<>();
                  for (int i = 1; i < 255; i++) {
                      final String h = base + i;
                      if (h.equals(my)) continue;
                      fs.add(ex.submit((Callable<String>) () -> {
                          Socket s = new Socket();
                          try {
                              s.connect(new InetSocketAddress(h, port), 600);
                              return h;
                          } catch (Exception e) {
                              return null;
                          } finally {
                              try { s.close(); } catch (Exception ignored) {}
                          }
                      }));
                  }
                  JSArray found = new JSArray();
                  try {
                      for (Future<String> f : fs) {
                          String r = f.get();
                          if (r != null) found.put(r);
                      }
                  } catch (Exception e) {
                      ex.shutdownNow();
                      call.reject("Error al buscar");
                      return;
                  }
                  ex.shutdown();
                  JSObject o = new JSObject();
                  o.put("hosts", found);
                  o.put("myIp", my);
                  call.resolve(o);
              }
          }
